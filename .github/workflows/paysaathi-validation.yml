name: PaySaathi code validation

on:
  pull_request:
  push:
    branches:
      - main
      - fix/paysaathi-auth-cms-2026-11-27

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          files = ["index.html", "login.html", "signup.html", "dashboard.html", "admin.html", "support.html"]
          with tempfile.TemporaryDirectory() as tmp:
              for filename in files:
                  source = pathlib.Path(filename).read_text(encoding="utf-8")
                  scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, re.I | re.S)
                  for number, script in enumerate(scripts, 1):
                      if not script.strip():
                          continue
                      target = pathlib.Path(tmp) / f"{pathlib.Path(filename).stem}-{number}.mjs"
                      target.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(target)], check=True)
          PY
      - name: Check login OTP Edge Function
        run: deno check supabase/functions/password-email-otp/index.ts
