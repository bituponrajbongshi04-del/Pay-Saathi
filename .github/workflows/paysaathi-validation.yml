name: PaySaathi code validation

on:
  pull_request:
  push:
    branches:
      - main
      - fix/paysaathi-auth-cms-2026-11-27

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline and PWA JavaScript syntax
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, tempfile
          files = ["index.html", "login.html", "signup.html", "register.html", "forgot-password.html", "reset-password.html", "dashboard.html", "admin.html", "white-label.html", "business-admin.html", "support.html", "contact-support.html", "privacy-policy.html", "refund-policy.html", "terms.html"]
          with tempfile.TemporaryDirectory() as tmp:
              targets = []
              for filename in files:
                  source = pathlib.Path(filename).read_text(encoding="utf-8")
                  scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, re.I | re.S)
                  for number, script in enumerate(scripts, 1):
                      if not script.strip():
                          continue
                      target = pathlib.Path(tmp) / f"{pathlib.Path(filename).stem}-{number}.mjs"
                      target.write_text(script, encoding="utf-8")
                      targets.append(target)
              for filename in ["pwa.js", "service-worker.js", "tenant-branding.js"]:
                  target = pathlib.Path(tmp) / filename
                  target.write_text(pathlib.Path(filename).read_text(encoding="utf-8"), encoding="utf-8")
                  targets.append(target)
              for target in targets:
                  subprocess.run(["node", "--check", str(target)], check=True)
          for filename in ["manifest.webmanifest", "release.json"]:
              json.loads(pathlib.Path(filename).read_text(encoding="utf-8"))
          PY
