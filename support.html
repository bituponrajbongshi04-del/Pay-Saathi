<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1456d9"><title>PaySaathi Support Desk</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1456d9;color:#fff;font-weight:700}.secondary{background:#eef3ff;color:#1456d9}.danger{background:#fff0ef;color:#b42318}.shell{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #e5ebf4;border-radius:16px;padding:16px;margin-bottom:16px}.brand{font-size:20px;font-weight:900;color:#1456d9}.muted{color:#6b7890;font-size:13px}.panel,.ticket{background:#fff;border:1px solid #e5ebf4;border-radius:15px;padding:16px;margin:12px 0}.ticket-head{display:flex;justify-content:space-between;gap:10px}.status{font-size:12px;font-weight:800;color:#9a6700}.messages{display:grid;gap:8px;margin:14px 0}.msg{background:#f4f7fc;padding:10px;border-radius:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{display:flex;gap:8px}.reply input{flex:1;min-width:0}input{width:100%;border:1px solid #dce4f0;border-radius:10px;padding:11px}#login{max-width:390px;margin:12vh auto}.error{color:#b42318}.empty{padding:28px;text-align:center;color:#6b7890}@media(max-width:600px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column}.reply{flex-direction:column}.reply button{width:100%}}
</style></head><body>
<div id="login" class="panel" style="display:none"><div class="brand">PaySaathi Support</div><h2>Agent sign in</h2><p class="muted">Use the email and password created for your agent account.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><br><br><input id="password" type="password" placeholder="Password" required><br><br><button style="width:100%">Sign in</button></form><p id="loginError" class="error"></p></div>
<div id="app" class="shell" style="display:none"><header class="top"><div><div class="brand">PaySaathi Support Desk</div><div id="agentEmail" class="muted"></div></div><div style="display:flex;gap:8px"><button id="refresh" class="secondary">Refresh</button><button id="logout" class="danger">Log out</button></div></header><section class="panel"><h2 style="margin:0 0 6px">Assigned tickets</h2><p class="muted">Only tickets assigned to your agent account are shown here. Customer details and transaction history are available within each ticket.</p><input id="ticketSearch" type="search" placeholder="Search assigned tickets by customer name, phone, subject or ID" style="margin-top:10px"></section><div id="tickets"><div class="empty">Loading tickets…</div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://hhqcycwfvxoxjizlbivv.supabase.co';
const KEY='sb_publishable_NdrUA-ubf67oW5hiS-Yw4A_-r2xbJRV';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let agent=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function verify(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return false;const {data:allowed,error:e}=await db.rpc('is_paysaathi_support');if(e)throw e;if(allowed!==true)throw new Error('This account is not an active support agent. Ask the administrator to add it.');agent=user;$('agentEmail').textContent=user.email||'';return true;}
let ticketCache=[];
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(v)||0);}
async function load(){const refresh=$('refresh');if(refresh){refresh.disabled=true;refresh.textContent='Refreshing…';}try{const {data,error}=await db.from('ps_tickets').select('id,user_id,subject,message,status,created_at').eq('assigned_agent',agent.id).order('created_at',{ascending:false});if(error)throw error;const active=(data||[]).filter(t=>String(t.status||'').toLowerCase()!=='closed');const loaded=await Promise.all(active.map(async t=>{const [detailResult,msgResult]=await Promise.all([db.rpc('paysaathi_support_get_ticket_details',{p_ticket_id:t.id}),db.from('ps_ticket_messages').select('sender_id,message,created_at').eq('ticket_id',t.id).order('created_at')]);const raw=detailResult.data||{};const details=Array.isArray(raw)?(raw[0]||{}):raw;if(msgResult.error)throw msgResult.error;return {...t,details,messages:msgResult.data||[],detailsError:detailResult.error?.message||''};}));ticketCache=loaded;renderTickets();}finally{if(refresh){refresh.disabled=false;refresh.textContent='Refresh';}}}
function renderTickets(){const box=$('tickets'),q=($('ticketSearch')?.value||'').trim().toLowerCase();const rows=ticketCache.filter(t=>String(t.status||'').toLowerCase()!=='closed').filter(t=>[t.subject,t.message,t.id,t.details.customer?.full_name,t.details.customer?.phone,t.details.customer?.email].some(v=>String(v||'').toLowerCase().includes(q)));if(!rows.length){box.innerHTML='<div class="panel empty">'+(ticketCache.length?'No matching assigned tickets.':'No tickets assigned to you yet.')+'</div>';return;}box.innerHTML=rows.map(t=>{const c=t.details.customer||{},tx=Array.isArray(t.details.transactions)?t.details.transactions:[];const customerProblem=t.detailsError||(!c.full_name&&!c.phone&&!c.email?'Customer details returned empty. Check ticket user_id and the support details RPC.':'');const txHtml=tx.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th align="left">Date</th><th align="left">Type</th><th align="left">Amount</th><th align="left">Status</th><th align="left">Reference</th></tr></thead><tbody>${tx.map(x=>`<tr><td style="padding:7px 4px;border-top:1px solid #e5ebf4">${esc(x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'—')}</td><td style="padding:7px 4px;border-top:1px solid #e5ebf4">${esc(x.type)}</td><td style="padding:7px 4px;border-top:1px solid #e5ebf4">${money(x.amount)}</td><td style="padding:7px 4px;border-top:1px solid #e5ebf4">${esc(x.status)}</td><td style="padding:7px 4px;border-top:1px solid #e5ebf4">${esc(x.reference||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No transaction history found for this customer.</p>';return `<article class="ticket"><div class="ticket-head"><div><strong>${esc(t.subject)}</strong><div class="muted">Ticket: ${esc(t.id)} · ${new Date(t.created_at).toLocaleString('en-IN')}</div></div><span class="status">${esc(t.status)}</span></div><p style="white-space:pre-wrap;font-size:14px">${esc(t.message)}</p><section style="background:#f4f7fc;border-radius:12px;padding:12px;margin:12px 0"><strong>Customer details</strong><div style="display:grid;gap:5px;margin-top:8px;font-size:13px"><div><b>Name:</b> ${esc(c.full_name||'Not available')}</div><div><b>Phone:</b> ${esc(c.phone||'Not available')}</div><div><b>Email:</b> ${esc(c.email||'Not available')}</div><div class="muted"><b>Customer ID:</b> ${esc(t.user_id||'Not available')}</div>${customerProblem?`<div class="error">Details issue: ${esc(customerProblem)}</div>`:''}</div></section><section style="margin:12px 0"><strong>Customer transactions (${tx.length})</strong>${txHtml}</section><strong>Conversation</strong><div class="messages" id="m-${t.id}">${t.messages.map(m=>`<div class="msg">${esc(m.sender_id===agent.id?'You: ':'Customer: ')}${esc(m.message)}</div>`).join('')}</div><div class="reply"><input data-reply="${t.id}" maxlength="2000" placeholder="Reply to customer…" ${t.status==='closed'?'disabled':''}><button data-send="${t.id}" ${t.status==='closed'?'disabled':''}>Send reply</button><button class="secondary" data-close="${t.id}" ${t.status==='closed'?'disabled':''}>Close ticket</button></div></article>`;}).join('');box.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{const input=box.querySelector(`[data-reply="${b.dataset.send}"]`),message=input.value.trim();if(!message)return;b.disabled=true;const {error}=await db.from('ps_ticket_messages').insert({ticket_id:b.dataset.send,sender_id:agent.id,message});b.disabled=false;if(error){alert(error.message);return;}await load();});box.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{if(!confirm('Close this ticket?'))return;b.disabled=true;const {data,error}=await db.from('ps_tickets').update({status:'closed'}).eq('id',b.dataset.close).eq('assigned_agent',agent.id).select('id,status').maybeSingle();if(error){b.disabled=false;alert('Ticket close nahi hua: '+error.message);return;}if(!data){b.disabled=false;alert('Ticket close nahi hua. Is ticket par aapka update access nahi hai ya ticket aapko assigned nahi hai.');return;}ticketCache=ticketCache.filter(t=>t.id!==b.dataset.close);renderTickets();load().catch(e=>alert('Ticket close ho gaya, lekin list refresh nahi hui: '+e.message));});}
$('ticketSearch').addEventListener('input',renderTickets);
async function boot(){try{const ok=await verify();if(ok){$('app').style.display='block';await load();}else $('login').style.display='block';}catch(e){$('login').style.display='block';$('loginError').textContent=e.message;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return;}await boot();});
$('refresh').onclick=()=>load().catch(e=>alert('Tickets refresh nahi hue: '+e.message));$('logout').onclick=async()=>{await db.auth.signOut();location.reload();};
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload();});
const {data:{session}}=await db.auth.getSession();if(session){$('login').style.display='block';await boot();}else $('login').style.display='block';
</script></body></html>
