<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1456d9"><title>PaySaathi Support Desk</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1456d9;color:#fff;font-weight:700}.secondary{background:#eef3ff;color:#1456d9}.danger{background:#fff0ef;color:#b42318}.shell{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #e5ebf4;border-radius:16px;padding:16px;margin-bottom:16px}.brand{font-size:20px;font-weight:900;color:#1456d9}.muted{color:#6b7890;font-size:13px}.panel,.ticket{background:#fff;border:1px solid #e5ebf4;border-radius:15px;padding:16px;margin:12px 0}.ticket-head{display:flex;justify-content:space-between;gap:10px}.status{font-size:12px;font-weight:800;color:#9a6700}.messages{display:grid;gap:8px;margin:14px 0}.msg{background:#f4f7fc;padding:10px;border-radius:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{display:flex;gap:8px}.reply input{flex:1;min-width:0}input{width:100%;border:1px solid #dce4f0;border-radius:10px;padding:11px}#login{max-width:390px;margin:12vh auto}.error{color:#b42318}.empty{padding:28px;text-align:center;color:#6b7890}@media(max-width:600px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column}.reply{flex-direction:column}.reply button{width:100%}}
</style></head><body>
<div id="login" class="panel" style="display:none"><div class="brand">PaySaathi Support</div><h2>Agent sign in</h2><p class="muted">Use the email and password created for your agent account.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><br><br><input id="password" type="password" placeholder="Password" required><br><br><button style="width:100%">Sign in</button></form><p id="loginError" class="error"></p></div>
<div id="app" class="shell" style="display:none"><header class="top"><div><div class="brand">PaySaathi Support Desk</div><div id="agentEmail" class="muted"></div></div><div style="display:flex;gap:8px"><button id="refresh" class="secondary">Refresh</button><button id="logout" class="danger">Log out</button></div></header><section class="panel"><h2 style="margin:0 0 6px">Assigned tickets</h2><p class="muted">Only tickets assigned to your agent account are shown here.</p></section><div id="tickets"><div class="empty">Loading tickets…</div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://hhqcycwfvxoxjizlbivv.supabase.co';
const KEY='sb_publishable_NdrUA-ubf67oW5hiS-Yw4A_-r2xbJRV';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let agent=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function verify(){const {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user)return false;const {data,error:e}=await db.from('ps_profiles').select('role,status').eq('id',user.id).maybeSingle();if(e)throw e;if(data?.role!=='agent'||data?.status!=='active')throw new Error('This account is not an active support agent. Ask the administrator to add it.');agent=user;$('agentEmail').textContent=user.email||'';return true;}
async function load(){const {data,error}=await db.from('ps_tickets').select('id,user_id,subject,message,status,created_at').eq('assigned_agent',agent.id).neq('status','closed').order('created_at',{ascending:false});if(error)throw error;const box=$('tickets');if(!data?.length){box.innerHTML='<div class="panel empty">No tickets assigned to you yet.</div>';return;}box.innerHTML=data.map(t=>`<article class="ticket"><div class="ticket-head"><div><strong>${esc(t.subject)}</strong><div class="muted">Customer: ${esc(t.user_id)} · ${new Date(t.created_at).toLocaleString('en-IN')}</div></div><span class="status">${esc(t.status)}</span></div><p style="white-space:pre-wrap;font-size:14px">${esc(t.message)}</p><div class="messages" id="m-${t.id}"></div><div class="reply"><input data-reply="${t.id}" maxlength="2000" placeholder="Reply to customer…" ${t.status==='closed'?'disabled':''}><button data-send="${t.id}" ${t.status==='closed'?'disabled':''}>Send reply</button><button class="secondary" data-close="${t.id}" ${t.status==='closed'?'disabled':''}>Close ticket</button></div></article>`).join('');
const {data:profiles}=await db.from('ps_profiles').select('id,role,full_name');
const roleById=new Map((profiles||[]).map(p=>[p.id,p]));
for(const t of data){
  const {data:msgs,error:me}=await db.from('ps_ticket_messages').select('sender_id,message,created_at').eq('ticket_id',t.id).order('created_at');
  const el=$('m-'+t.id);if(me){el.textContent=me.message;continue;}
  for(const m of msgs||[]){
    const p=document.createElement('div');p.className='msg';
    const sender=roleById.get(m.sender_id);
    const label=m.sender_id===agent.id?'You':m.sender_id===t.user_id?'Customer':sender?.role==='admin'?'Admin':sender?.role==='agent'?'Support agent':'Support team';
    p.textContent=label+': '+m.message;el.appendChild(p);
  }
}
box.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{const input=box.querySelector(`[data-reply="${b.dataset.send}"]`),message=input.value.trim();if(!message)return;b.disabled=true;const {error}=await db.from('ps_ticket_messages').insert({ticket_id:b.dataset.send,sender_id:agent.id,message});b.disabled=false;if(error){alert(error.message);return;}await load();});
box.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{if(!confirm('Close this ticket?'))return;const {error}=await db.from('ps_tickets').update({status:'closed'}).eq('id',b.dataset.close);if(error){alert(error.message);return;}await load();});}
async function boot(){try{const ok=await verify();if(ok){$('app').style.display='block';await load();}else $('login').style.display='block';}catch(e){$('login').style.display='block';$('loginError').textContent=e.message;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return;}await boot();});
$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('logout').onclick=async()=>{await db.auth.signOut();location.reload();};
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload();});
const {data:{session}}=await db.auth.getSession();if(session){await boot();}else $('login').style.display='block';
</script></body></html>
