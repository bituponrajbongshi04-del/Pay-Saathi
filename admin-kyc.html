<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d35"><title>PaySaathi · KYC Review</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3f8fc;color:#10243a;font-family:'Plus Jakarta Sans',sans-serif}header{background:#071d35;color:#fff;padding:17px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}a{color:#2a9ed3;text-decoration:none;font-weight:800;font-size:12px}.wrap{max-width:1120px;margin:28px auto;padding:0 18px}.hero{padding:24px;border-radius:22px;background:linear-gradient(120deg,#071d35,#0b4772 68%,#087fca);color:#fff}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#d6edfc;font-size:12px}.tools{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.tools input,.tools select{padding:11px;border:1px solid #dce8f1;border-radius:10px;background:#fff;font:inherit;font-size:12px}.list{display:grid;gap:11px}.item{background:#fff;border:1px solid #e0eaf2;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.item h3{margin:0;font-size:13px}.item p{font-size:10px;color:#72879a;margin:5px 0}.pill{border-radius:99px;padding:6px 9px;font-size:9px;font-weight:900;background:#fff2d9;color:#8a5d00}.pill.approved{background:#e4f8ec;color:#17643c}.pill.rejected{background:#ffeded;color:#a52c24}.btn{border:0;padding:10px 13px;border-radius:10px;background:#087fca;color:#fff;font:inherit;font-size:10px;font-weight:900;cursor:pointer}.btn.alt{background:#eaf4fa;color:#24516d}.detail{display:none;background:#fff;border:1px solid #dfebf3;border-radius:18px;padding:18px;margin-top:14px}.detail.show{display:block}.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}.doc{border:1px solid #e1ebf3;border-radius:14px;padding:12px}.doc strong{font-size:11px}.doc a{display:block;margin:10px 0}.doc small{font-size:10px;color:#72879a}.detail textarea{width:100%;min-height:80px;border:1px solid #dce8f1;border-radius:10px;padding:11px;font:inherit;font-size:12px}.notice{padding:11px;border-radius:10px;background:#edf7fc;color:#24516d;font-size:11px;margin:12px 0}.notice.error{background:#ffeded;color:#a52c24}@media(max-width:620px){.item{grid-template-columns:1fr}.wrap{margin:17px auto}.hero{padding:20px}}</style></head><body><header><b>PaySaathi · KYC Desk</b><a href="admin.html">← Admin console</a></header><main class="wrap"><section class="hero"><h1>Identity verification queue</h1><p>Review submitted documents securely. Approve only after the identity and document checks are completed.</p></section><div class="tools"><input id="search" placeholder="Search customer name / email"><select id="filter"><option value="">All statuses</option><option value="submitted">Submitted</option><option value="under_review">Under review</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button class="btn" id="refresh">Refresh queue</button></div><div id="notice" class="notice">Checking administrator access…</div><section id="queue" class="list"></section><section id="detail" class="detail"><h2 id="detailTitle" style="font-size:17px;margin:0">Review KYC</h2><p id="detailMeta" style="font-size:11px;color:#71869a"></p><div id="docs" class="docs"></div><label style="display:block;font-size:11px;font-weight:800;margin:12px 0 7px">Reviewer note / rejection reason</label><textarea id="reviewNote" placeholder="Record the verification result or what the customer needs to correct…"></textarea><div class="tools"><button class="btn" id="approve">Approve KYC</button><button class="btn alt" id="reject">Reject / request correction</button></div></section></main><script type="module" src="./admin-kyc.js"></script></body></html>
