<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b57d0">
<title>Forgot Password | PaySaathi</title>
<meta name="description" content="Reset your PaySaathi account password securely.">
<style>
:root {
--blue:#0b57d0;
--dark:#073b91;
--ink:#172033;
--muted:#667085;
--line:#e2e8f0;
}
{ box-sizing:border-box; }
body {
margin:0;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
color:var(--ink);
background:radial-gradient(circle at 10% 10%,#e0ebff,transparent 32%),#f5f8ff;
min-height:100vh;
display:flex;
flex-direction:column;
}
a { color:var(--blue); text-decoration:none; }
a:hover { text-decoration:underline; }
header {
background:#ffffffed;
border-bottom:1px solid var(--line);
}
.nav {
width:min(1100px,calc(100% - 32px));
min-height:70px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}
.brand {
display:flex;
align-items:center;
gap:10px;
font-size:1.2rem;
font-weight:850;
color:var(--ink);
}
.mark {
display:grid;
place-items:center;
width:40px;
height:40px;
border-radius:13px;
color:white;
background:linear-gradient(145deg,#1675f5,var(--dark));
}
.brand-name span { color:var(--blue); }
main {
flex:1;
width:min(480px,calc(100% - 32px));
margin:0 auto;
padding:54px 0;
display:flex;
align-items:center;
justify-content:center;
}
.card {
width:100%;
background:white;
border:1px solid #e6ecf5;
border-radius:22px;
padding:36px;
box-shadow:0 18px 55px #1c3b700d;
}
.heading { text-align:center; margin-bottom:28px; }
.icon-box {
width:56px;
height:56px;
border-radius:16px;
background:#e6efff;
color:var(--blue);
display:grid;
place-items:center;
margin:0 auto 16px;
font-size:1.5rem;
}
h1 {
font-size:1.75rem;
letter-spacing:-0.5px;
margin:0 0 8px;
}
.heading p {
color:var(--muted);
line-height:1.6;
font-size:0.95rem;
margin:0;
}
.field { margin-top:20px; }
label {
display:block;
margin-bottom:7px;
font-weight:750;
font-size:.88rem;
}
input {
display:block;
width:100%;
border:1px solid #d0d8e5;
border-radius:11px;
padding:12px 13px;
background:white;
color:var(--ink);
font:inherit;
outline:none;
min-height:47px;
}
input:focus {
border-color:var(--blue);
box-shadow:0 0 0 3px #0b57d018;
}
button {
width:100%;
min-height:49px;
margin-top:24px;
border:0;
border-radius:12px;
background:var(--blue);
color:white;
font:inherit;
font-weight:800;
cursor:pointer;
}
button:hover { background:var(--dark); }
button:disabled { opacity:.65; cursor:wait; }
.status {
display:none;
margin-top:18px;
padding:12px;
border-radius:10px;
line-height:1.5;
font-size:0.9rem;
overflow-wrap:anywhere;
}
.status.show { display:block; }
.status.error { background:#fff0ef; color:#b42318; }
.status.ok { background:#eaf8f0; color:#137a4b; }
.back-link {
text-align:center;
margin-top:24px;
font-size:0.9rem;
}
footer {
padding:20px 16px;
text-align:center;
color:var(--muted);
font-size:.82rem;
}
@media(max-width:520px) {
main { padding:30px 0; }
.card { padding:24px; }
}
</style>
</head>
<body>
<header>
<nav class="nav">
<a class="brand" href="index.html" aria-label="PaySaathi home">
<span class="mark">P</span>
<span class="brand-name">Pay<span>Saathi</span></span>
</a>
<a href="index.html">← Back to home</a>
</nav>
</header>
<main>
<div class="card">
<div class="heading">
<div class="icon-box">🔒</div>
<h1>Forgot password?</h1>
<p>No worries! Enter your registered email address and we'll send you a password reset link.</p>
</div>
<!-- Update the action URL below to your backend API or Formspree endpoint -->
<form id="resetForm" action="https://formspree.io/f/mbggrqow" method="POST">
<div class="field">
<label for="email">Email address *</label>
<input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required>
</div>
<button id="sendButton" type="submit">Send Reset Link</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
</form>
<div class="back-link">
Remember your password? <a href="login.html">Sign in</a>
</div>
</div>
</main>
<footer>© <span id="year"></span> PaySaathi. All rights reserved.</footer>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const form = document.getElementById('resetForm');
const statusBox = document.getElementById('status');
const sendButton = document.getElementById('sendButton');
form.addEventListener('submit', async function(event) {
event.preventDefault();
statusBox.className = 'status';
statusBox.textContent = '';
sendButton.disabled = true;
sendButton.textContent = 'Sending link...';
try {
const response = await fetch(form.action, {
method: 'POST',
body: new FormData(form),
headers: { 'Accept': 'application/json' }
});
if (!response.ok) {
throw new Error('Request failed');
}
form.reset();
statusBox.className = 'status show ok';
statusBox.textContent = 'Success! If an account exists for that email, a password reset link has been sent.';
} catch (error) {
statusBox.className = 'status show error';
statusBox.textContent = 'Could not process request. Please try again or contact paysaathi.support@gmail.com directly.';
} finally {
sendButton.disabled = false;
sendButton.textContent = 'Send Reset Link';
}
});
</script>
</body>
</html>
