<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b57d0">
<title>Reset Password | PaySaathi</title>
<meta name="description" content="Set a new password for your PaySaathi account.">
<style>
:root {
  --blue:#0b57d0;
  --dark:#073b91;
  --ink:#172033;
  --muted:#667085;
  --line:#e2e8f0;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 10% 10%,#e0ebff,transparent 32%),#f5f8ff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a { color:var(--blue); text-decoration:none; }
a:hover { text-decoration:underline; }
header {
  background:#ffffffed;
  border-bottom:1px solid var(--line);
}
.nav {
  width:min(1100px,calc(100% - 32px));
  min-height:70px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.2rem;
  font-weight:850;
  color:var(--ink);
}
.mark {
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border-radius:13px;
  color:white;
  background:linear-gradient(145deg,#1675f5,var(--dark));
}
.brand-name span { color:var(--blue); }
main {
  flex:1;
  width:min(480px,calc(100% - 32px));
  margin:0 auto;
  padding:54px 0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card {
  width:100%;
  background:white;
  border:1px solid #e6ecf5;
  border-radius:22px;
  padding:36px;
  box-shadow:0 18px 55px #1c3b700d;
}
.heading { text-align:center; margin-bottom:28px; }
.icon-box {
  width:56px;
  height:56px;
  border-radius:16px;
  background:#e6efff;
  color:var(--blue);
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  font-size:1.5rem;
}
h1 {
  font-size:1.75rem;
  letter-spacing:-0.5px;
  margin:0 0 8px;
}
.heading p {
  color:var(--muted);
  line-height:1.6;
  font-size:0.95rem;
  margin:0;
}
.field { margin-top:18px; }
label {
  display:block;
  margin-bottom:7px;
  font-weight:750;
  font-size:.88rem;
}
.pass-wrapper { position:relative; }
input {
  display:block;
  width:100%;
  border:1px solid #d0d8e5;
  border-radius:11px;
  padding:12px 13px;
  background:white;
  color:var(--ink);
  font:inherit;
  outline:none;
  min-height:47px;
}
.pass-wrapper input { padding-right:72px; }
input:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px #0b57d018;
}
.toggle {
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--blue);
  font-weight:750;
  padding:8px;
  cursor:pointer;
}
button.submit {
  width:100%;
  min-height:49px;
  margin-top:24px;
  border:0;
  border-radius:12px;
  background:var(--blue);
  color:white;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
button.submit:hover { background:var(--dark); }
button.submit:disabled { opacity:.65; cursor:wait; }
.status {
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
  font-size:0.9rem;
  overflow-wrap:anywhere;
}
.status.show { display:block; }
.status.error { background:#fff0ef; color:#b42318; border:1px solid #ffd5d2; }
.status.ok { background:#eaf8f0; color:#137a4b; border:1px solid #c7ecd6; }
.back-link {
  text-align:center;
  margin-top:24px;
  font-size:0.9rem;
}
footer {
  padding:20px 16px;
  text-align:center;
  color:var(--muted);
  font-size:.82rem;
}
@media(max-width:520px) {
  main { padding:30px 0; }
  .card { padding:24px; }
}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="brand" href="index.html" aria-label="PaySaathi home">
      <span class="mark">P</span>
      <span class="brand-name">Pay<span>Saathi</span></span>
    </a>
    <a href="index.html">← Back to home</a>
  </nav>
</header>

<main>
  <div class="card">
    <div class="heading">
      <div class="icon-box">🔑</div>
      <h1>Set new password</h1>
      <p>Enter your new password below to update your PaySaathi account.</p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <form id="updatePasswordForm">
      <div class="field">
        <label for="password">New Password *</label>
        <div class="pass-wrapper">
          <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required>
          <button class="toggle" id="togglePassword" type="button">Show</button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password *</label>
        <div class="pass-wrapper">
          <input id="confirmPassword" type="password" placeholder="Re-enter password" minlength="6" required>
          <button class="toggle" id="toggleConfirmPassword" type="button">Show</button>
        </div>
      </div>

      <button class="submit" id="saveButton" type="submit">Update Password</button>
    </form>

    <div class="back-link">
      Back to <a href="login.html">Sign in</a>
    </div>
  </div>
</main>

<footer>© <span id="year"></span> PaySaathi. All rights reserved.</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hhqcycwfvxoxjizlbivv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NdrUA-ubf67oW5hiS-Yw4A_-r2xbJRV';

document.getElementById('year').textContent = new Date().getFullYear();

const form = document.getElementById('updatePasswordForm');
const statusBox = document.getElementById('status');
const saveButton = document.getElementById('saveButton');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');

let supabase = null;
try {
  supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
} catch (error) {
  console.error('Supabase setup error:', error);
}

function showStatus(text, type='error') {
  statusBox.textContent = text;
  statusBox.className = 'status show ' + type;
}

// Password toggle buttons
document.getElementById('togglePassword').addEventListener('click', (e) => {
  const isPass = passwordInput.type === 'password';
  passwordInput.type = isPass ? 'text' : 'password';
  e.target.textContent = isPass ? 'Hide' : 'Show';
});

document.getElementById('toggleConfirmPassword').addEventListener('click', (e) => {
  const isPass = confirmPasswordInput.type === 'password';
  confirmPasswordInput.type = isPass ? 'text' : 'password';
  e.target.textContent = isPass ? 'Hide' : 'Show';
});

// Check if user came from reset link session
async function checkSession() {
  if (!supabase) return;
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    showStatus('Invalid or expired password reset link. Please request a new one from the Forgot Password page.');
    form.style.display = 'none';
  }
}

checkSession();

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  statusBox.className = 'status';

  const newPassword = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (newPassword !== confirmPassword) {
    showStatus('Passwords do not match. Please check again.');
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = 'Updating...';

  try {
    const { error } = await supabase.auth.updateUser({ password: newPassword });

    if (error) throw error;

    showStatus('Your password has been updated successfully! Redirecting to login...', 'ok');
    form.reset();
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);
  } catch (error) {
    console.error('Password update error:', error);
    showStatus(error?.message || 'Could not update password. Please try requesting a new link.');
    saveButton.disabled = false;
    saveButton.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
