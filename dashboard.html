<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard & Wallet | PaySaathi</title>
<style>
:root{--blue:#0b57d0;--dark:#073b91;--ink:#172033;--muted:#667085;--line:#e2e8f0;--green:#137a4b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#f5f8ff;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line);height:70px;display:flex;align-items:center}
.nav{width:min(1100px,calc(100% - 32px));margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:850;font-size:1.2rem;color:var(--ink);text-decoration:none}
.brand span{color:var(--blue)}
main{flex:1;width:min(900px,calc(100% - 32px));margin:30px auto;display:grid;gap:24px}
.card{background:white;border:1px solid #e6ecf5;border-radius:20px;padding:28px;box-shadow:0 10px 30px #1c3b700d}
.wallet-box{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--blue),var(--dark));color:white;border-radius:16px;padding:24px}
.balance-amount{font-size:2.2rem;font-weight:800;margin:6px 0 0}
.btn{background:white;color:var(--blue);border:0;padding:10px 20px;border-radius:10px;font-weight:750;cursor:pointer}
.btn:hover{background:#f0f4ff}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:var(--dark)}
h2{margin-top:0;font-size:1.4rem}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:16px}
.service-card{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.price{font-size:1.2rem;font-weight:800;color:var(--green);margin:10px 0}
.message{padding:12px;border-radius:10px;font-size:0.9rem;margin-bottom:16px;display:none}
.message.show{display:block}
.message.error{background:#fff0ef;color:#b42318}
.message.ok{background:#eaf8f0;color:var(--green)}
</style>
</head>
<body>
<header><div class="nav">
<a class="brand" href="dashboard.html">Pay<span>Saathi</span> Dashboard</a>
<button class="btn" id="logoutBtn" style="background:#fee;color:#c00">Sign Out</button>
</div></header>

<main>
<div id="message" class="message"></div>

<!-- Wallet Section -->
<div class="card">
  <div class="wallet-box">
    <div>
      <span style="opacity:0.85;font-size:0.9rem;">Available Balance</span>
      <div class="balance-amount" id="walletBalance">₹0.00</div>
    </div>
    <button class="btn" id="topupBtn">+ Add ₹500 Top-Up</button>
  </div>
</div>

<!-- Services Section -->
<div class="card">
  <h2>Available Services</h2>
  <p style="color:var(--muted);font-size:0.92rem;">Select a service to pay instantly using your wallet balance.</p>
  <div class="services-grid" id="servicesList">
    <p style="color:var(--muted)">Loading services...</p>
  </div>
</div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hhqcycwfvxoxjizlbivv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NdrUA-ubf67oW5hiS-Yw4A_-r2xbJRV';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const messageBox = document.getElementById('message');
const balanceEl = document.getElementById('walletBalance');
const servicesList = document.getElementById('servicesList');

function showMsg(text, type='error') {
  messageBox.textContent = text;
  messageBox.className = 'message show ' + type;
}

let currentUser = null;

async function initDashboard() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;
  loadWallet();
  loadServices();
}

async function loadWallet() {
  const { data } = await supabase
    .from('wallets')
    .select('balance')
    .eq('id', currentUser.id)
    .single();

  if (data) {
    balanceEl.textContent = `₹${parseFloat(data.balance).toFixed(2)}`;
  }
}

async function loadServices() {
  const { data, error } = await supabase.from('services').select('*');
  if (error) {
    servicesList.innerHTML = '<p style="color:red">Could not load services.</p>';
    return;
  }

  if (!data || data.length === 0) {
    servicesList.innerHTML = '<p>No services available right now.</p>';
    return;
  }

  servicesList.innerHTML = data.map(service => `
    <div class="service-card">
      <div>
        <strong>${service.title}</strong>
        <p style="color:var(--muted);font-size:0.85rem;margin:6px 0 12px">${service.description}</p>
      </div>
      <div>
        <div class="price">₹${parseFloat(service.price).toFixed(2)}</div>
        <button class="btn btn-primary" onclick="payService(${service.id}, ${service.price}, '${service.title}')" style="width:100%">Pay Now</button>
      </div>
    </div>
  `).join('');
}

// Top up wallet function
document.getElementById('topupBtn').addEventListener('click', async () => {
  const topupAmount = 500.00;
  
  const { data: wallet } = await supabase.from('wallets').select('balance').eq('id', currentUser.id).single();
  const newBalance = parseFloat(wallet.balance) + topupAmount;

  const { error } = await supabase.from('wallets').update({ balance: newBalance }).eq('id', currentUser.id);
  if (error) {
    showMsg('Top-up failed. Try again.');
    return;
  }

  await supabase.from('transactions').insert({
    user_id: currentUser.id,
    amount: topupAmount,
    type: 'topup',
    description: 'Wallet Top-Up via Test Gateway'
  });

  showMsg(`Successfully added ₹${topupAmount} to your wallet!`, 'ok');
  loadWallet();
});

// Pay for service function exposed globally
window.payService = async function(serviceId, price, title) {
  messageBox.className = 'message';
  
  const { data: wallet } = await supabase.from('wallets').select('balance').eq('id', currentUser.id).single();
  const currentBalance = parseFloat(wallet.balance);

  if (currentBalance < price) {
    showMsg(`Insufficient wallet balance! Please top-up ₹${(price - currentBalance).toFixed(2)} more.`);
    return;
  }

  const newBalance = currentBalance - price;

  const { error: walletError } = await supabase.from('wallets').update({ balance: newBalance }).eq('id', currentUser.id);
  if (walletError) {
    showMsg('Payment processing error.');
    return;
  }

  await supabase.from('transactions').insert({
    user_id: currentUser.id,
    amount: price,
    type: 'payment',
    description: `Paid for service: ${title}`
  });

  showMsg(`Payment successful for "${title}"! ₹${price} deducted from wallet.`, 'ok');
  loadWallet();
};

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  window.location.href = 'login.html';
});

initDashboard();
</script>
</body>
</html>
